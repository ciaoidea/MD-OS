<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ecebe8;
      --paper: #fff;
      --ink: #202124;
      --muted: #6f7378;
      --line: #d2d4d7;
      --button: #f8f8f7;
      --button-hover: #e9e9e7;
      --accent: #1769e0;
      --danger: #b42318;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-color: #6b7280 #d7d8da;
      scrollbar-gutter: stable;
      scrollbar-width: auto;
    }
    body { min-height: 100%; margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); }
    html::-webkit-scrollbar { width: 18px; }
    html::-webkit-scrollbar-track { background: #d7d8da; }
    html::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 3px solid #d7d8da;
      border-radius: 999px;
      background: #6b7280;
    }
    html::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    button, input, select { font: inherit; }
    button { color: inherit; }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: .65rem;
      padding: .55rem .75rem;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    #title {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 650;
      padding: .35rem .25rem;
    }

    .tools, .actions { display: flex; align-items: center; gap: .2rem; min-width: 0; }
    .tools {
      grid-column: 1 / -1;
      grid-row: 2;
      flex-wrap: wrap;
      justify-content: flex-start;
      overflow: visible;
    }
    .actions { grid-column: 2; grid-row: 1; justify-content: flex-end; }

    .tool, .action {
      min-width: 2rem;
      height: 2rem;
      padding: 0 .52rem;
      border: 1px solid transparent;
      border-radius: .42rem;
      background: transparent;
      cursor: pointer;
    }

    .tool:hover, .action:hover { background: var(--button-hover); }
    .tool:focus-visible, .action:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .toolbar-graphic {
      flex: 0 0 2rem;
      display: inline-grid;
      place-items: center;
      position: relative;
      width: 2rem;
      min-width: 2rem;
      padding: 0;
      overflow: visible;
      line-height: 1;
    }

    .toolbar-icon {
      display: block;
      width: 1.1rem;
      height: 1.1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .toolbar-graphic[data-tone] {
      color: var(--tool-color);
      border-color: color-mix(in srgb, var(--tool-color) 28%, transparent);
      background: color-mix(in srgb, var(--tool-color) 10%, transparent);
    }
    .toolbar-graphic[data-tone]:hover {
      background: color-mix(in srgb, var(--tool-color) 18%, transparent);
    }
    .toolbar-graphic[data-tone="blue"] { --tool-color: #1769e0; }
    .toolbar-graphic[data-tone="green"] { --tool-color: #137333; }
    .toolbar-graphic[data-tone="purple"] { --tool-color: #7b1fa2; }
    .toolbar-graphic[data-tone="amber"] { --tool-color: #a15c00; }
    .toolbar-graphic[data-tone="teal"] { --tool-color: #00796b; }
    .toolbar-graphic[data-tone="red"] { --tool-color: #b42318; }

    .action.primary { background: var(--ink); color: var(--paper); }
    .action.primary:hover { opacity: .88; }
    .divider { width: 1px; height: 1.3rem; margin: 0 .22rem; background: var(--line); }
    .block.remote-change { animation: remote-pulse 1.15s ease; }
    @keyframes remote-pulse { 0% { background: rgb(31 157 85 / .16); } 100% { background: transparent; } }

    .workspace {
      overflow: visible;
      padding: 2.25rem max(3rem, calc((100vw - 58rem) / 2)) 5rem max(1rem, calc((100vw - 58rem) / 2));
    }

    .paper {
      width: min(100%, 52rem);
      min-height: 70rem;
      margin: 0 auto;
      padding: 5rem 5.5rem;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 10px 35px rgb(0 0 0 / .08);
      outline: 1px solid rgb(0 0 0 / .04);
    }

    .block {
      position: relative;
      min-height: 1.45em;
      margin: 0 0 .55rem;
    }
    .block.insertion-anchor::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -.34rem;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
      pointer-events: none;
    }
    .paper.insertion-at-start::before {
      content: "";
      display: block;
      height: 2px;
      margin: 0 0 .55rem;
      border-radius: 2px;
      background: var(--accent);
    }

    .block p:first-child, .block h1:first-child, .block h2:first-child, .block h3:first-child { margin-top: 0; }
    .block p:last-child, .block ul:last-child, .block ol:last-child { margin-bottom: 0; }
    .block h1 { font-size: 2rem; line-height: 1.15; margin: 1.2em 0 .45em; }
    .block h2 { font-size: 1.5rem; line-height: 1.2; margin: 1.1em 0 .45em; }
    .block h3 { font-size: 1.2rem; line-height: 1.25; margin: 1em 0 .4em; }
    .block p, .block li { line-height: 1.55; }
    .block blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--line); color: #4f5358; }
    .block pre { overflow: auto; padding: .8rem; background: #f4f4f3; border-radius: .35rem; }
    .block a { color: var(--accent); }

    table { width: 100%; border-collapse: collapse; margin: .8rem 0; }
    td, th { min-width: 3.5rem; padding: .48rem .55rem; border: 1px solid #aeb2b6; vertical-align: top; }
    th { background: #f1f2f3; font-weight: 650; }

    .formula {
      display: grid;
      place-items: center;
      min-height: 3.2rem;
      padding: .7rem;
      overflow-x: auto;
      cursor: text;
    }

    .formula math { font-size: 1.22rem; }
    .image { text-align: center; }
    .image img { display: block; max-width: 100%; height: auto; margin: .5rem auto; }
    .image figcaption { min-height: 1.4rem; color: var(--muted); font-size: .88rem; outline: 0; }

    .whiteboard {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: .55rem;
      background: #fff;
    }

    .whiteboard-toolbar {
      grid-column: 1 / -1;
      grid-row: 3;
      display: grid;
      gap: .22rem;
      padding: .25rem;
      min-width: 0;
      overflow: visible;
      border: 1px solid #d2d4d7;
      border-radius: .45rem;
      background: #f6f6f4;
      color: #202124;
      user-select: none;
    }

    .whiteboard-toolbar[hidden] { display: none; }

    .whiteboard-toolbar-row {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      justify-content: flex-start;
      gap: .15rem;
      width: 100%;
      min-width: 0;
      overflow: visible;
    }

    .whiteboard-control {
      flex: 0 1 1.75rem;
      display: inline-grid;
      place-items: center;
      position: relative;
      width: 1.75rem;
      max-width: 1.75rem;
      height: 1.75rem;
      min-width: 0;
      min-height: 1.75rem;
      padding: 0;
      border: 1px solid #c8cace;
      border-radius: .38rem;
      background: #fff;
      color: #202124;
      cursor: pointer;
      overflow: visible;
      line-height: 1;
    }

    .whiteboard-control.active { border-color: #1769e0; background: #dceaff; }
    .whiteboard-control:disabled { cursor: default; opacity: .45; }
    .whiteboard-control:focus-visible { outline: 2px solid #1769e0; outline-offset: 1px; }
    .whiteboard-icon {
      display: block;
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .whiteboard-color-dot {
      display: block;
      width: .72rem;
      height: .72rem;
      border-radius: 50%;
      background: var(--whiteboard-swatch);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--whiteboard-swatch) 70%, #fff);
      pointer-events: none;
    }
    .whiteboard-control[data-color].active .whiteboard-color-dot {
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1769e0;
    }

    .whiteboard-toolbar-row #ai-assist {
      flex: 0 0 1.75rem;
      width: 1.75rem;
      height: 1.75rem;
      margin-left: auto;
    }
    .whiteboard-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      cursor: crosshair;
      touch-action: pan-y pinch-zoom;
      overscroll-behavior-y: auto;
    }
    .whiteboard-canvas[data-tool="select"] { cursor: cell; }
    .whiteboard-canvas[data-tool="move"] { cursor: move; }

    .whiteboard-selection {
      fill: rgba(23, 105, 224, .08);
      stroke: #1769e0;
      stroke-width: 3;
      stroke-dasharray: 14 9;
      vector-effect: non-scaling-stroke;
      pointer-events: none;
    }

    .whiteboard-annotation-layer {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      pointer-events: none;
    }

    .whiteboard-latex {
      display: block;
      align-items: flex-start;
      width: 100%;
      overflow: visible;
      color: #1769e0;
      line-height: 1;
      white-space: nowrap;
    }

    .whiteboard-latex math {
      display: block;
      margin: 0;
      font-size: 1em;
      white-space: nowrap;
    }

    .whiteboard-resize-handle {
      display: grid;
      place-items: center;
      min-height: 1.65rem;
      border-top: 1px solid #d2d4d7;
      background: #f6f6f4;
      color: #5f6368;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
    }

    .whiteboard-resize-handle::before {
      width: 3.5rem;
      height: .28rem;
      border-radius: 999px;
      background: #9aa0a6;
      content: '';
    }

    .whiteboard-resize-handle:hover,
    .whiteboard-resize-handle:focus-visible,
    .whiteboard-resize-handle.active {
      background: #e8f0fe;
      color: #1769e0;
      outline: 0;
    }

    .whiteboard-resize-handle:hover::before,
    .whiteboard-resize-handle:focus-visible::before,
    .whiteboard-resize-handle.active::before { background: #1769e0; }

    .status {
      position: fixed;
      right: 3rem;
      bottom: 1rem;
      z-index: 15;
      min-height: 1.8rem;
      padding: .36rem .58rem;
      border: 1px solid var(--line);
      border-radius: .45rem;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      color: var(--muted);
      font-size: .78rem;
      opacity: 0;
      transform: translateY(.3rem);
      transition: opacity .15s ease, transform .15s ease;
      pointer-events: none;
    }

    .status.show { opacity: 1; transform: none; }
    .status.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      padding: 1rem;
      background: rgb(0 0 0 / .34);
    }

    .modal-backdrop.open { display: grid; }
    .modal {
      width: min(38rem, 100%);
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: .7rem;
      background: var(--paper);
      box-shadow: 0 22px 70px rgb(0 0 0 / .22);
    }

    .modal h2 { margin: 0 0 .8rem; font-size: 1rem; }
    .modal input {
      width: 100%;
      padding: .62rem .7rem;
      border: 1px solid var(--line);
      border-radius: .45rem;
      background: var(--paper);
      color: var(--ink);
    }

    .formula-preview { min-height: 5rem; display: grid; place-items: center; padding: .8rem; overflow: auto; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .4rem; }

    .page-scrollbar {
      position: fixed;
      z-index: 45;
      top: clamp(7rem, 18vh, 11rem);
      right: .22rem;
      bottom: .65rem;
      display: grid;
      grid-template-rows: 2.35rem minmax(4rem, 1fr) 2.35rem;
      width: 2.35rem;
      min-height: 9rem;
      overflow: hidden;
      border: 1px solid #7b8087;
      border-radius: .55rem;
      background: #e8e9eb;
      box-shadow: 0 1px 5px rgb(0 0 0 / .24);
      color: #202124;
      user-select: none;
    }

    .page-scroll-button {
      display: grid;
      place-items: center;
      width: 100%;
      min-width: 0;
      height: 2.35rem;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #f8f8f7;
      color: #202124;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    .page-scroll-button:first-child { border-bottom: 1px solid #9ca0a6; }
    .page-scroll-button:last-child { border-top: 1px solid #9ca0a6; }
    .page-scroll-button:active { background: #d7e6ff; }
    .page-scroll-button:focus-visible { position: relative; z-index: 2; outline: 2px solid #1769e0; outline-offset: -2px; }
    .page-scroll-button:disabled { opacity: .45; cursor: default; }

    .page-scroll-track {
      position: relative;
      min-height: 0;
      background: #c8cbd0;
      cursor: pointer;
      touch-action: none;
    }

    .page-scroll-thumb {
      position: absolute;
      top: 0;
      left: .27rem;
      width: calc(100% - .54rem);
      min-height: 2.75rem;
      border: 1px solid #565c64;
      border-radius: 999px;
      background: #747b85;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / .28);
      cursor: grab;
      touch-action: none;
      will-change: transform;
    }
    .page-scroll-thumb:active { cursor: grabbing; background: #4f5660; }
    .page-scrollbar[data-scrollable="false"] .page-scroll-track { opacity: .48; }

    #image-input, #notes-file-input { display: none; }

    .toolbar-graphic.ai-working {
      animation: ai-pulse 0.8s ease-in-out infinite alternate;
    }

    .ai-kitt-strip {
      position: relative;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: repeat(5, .34rem);
      align-items: center;
      gap: .16rem;
      height: 1.15rem;
      margin-left: .35rem;
      padding: .2rem .32rem;
      overflow: hidden;
      border: 1px solid #30363f;
      border-radius: .45rem;
      background: #101318;
      box-shadow: inset 0 0 .35rem rgb(0 0 0 / .72), 0 1px 2px rgb(0 0 0 / .2);
    }

    .ai-kitt-led {
      width: .34rem;
      height: .34rem;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 .18rem #22c55e, 0 0 .38rem rgb(34 197 94 / .58);
      opacity: .92;
    }

    .ai-kitt-strip::after {
      content: "";
      position: absolute;
      top: .12rem;
      bottom: .12rem;
      left: .28rem;
      width: .88rem;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, #ffffff 0 8%, #22c55e 28%, rgb(34 197 94 / .7) 48%, transparent 74%);
      filter: drop-shadow(0 0 .34rem #22c55e);
      pointer-events: none;
      animation: ai-kitt-scan 1.05s ease-in-out infinite alternate;
    }

    .ai-kitt-strip[data-state="working"] .ai-kitt-led {
      background: #ff2b1c;
      box-shadow: 0 0 .12rem #ff2b1c;
      opacity: .3;
    }

    .ai-kitt-strip[data-state="working"]::after {
      background: radial-gradient(ellipse at center, #ffffff 0 8%, #ff2b1c 28%, rgb(255 43 28 / .7) 48%, transparent 74%);
      filter: drop-shadow(0 0 .34rem #ff2b1c);
    }

    .ai-kitt-strip[data-state="failed"] .ai-kitt-led {
      background: #ff2b1c;
      box-shadow: 0 0 .2rem #ff2b1c, 0 0 .45rem rgb(255 43 28 / .68);
      opacity: 1;
    }

    @keyframes ai-kitt-scan {
      from { left: .28rem; }
      to { left: calc(100% - 1.16rem); }
    }

    @keyframes ai-pulse {
      from { transform: scale(0.96); opacity: 0.72; }
      to { transform: scale(1.04); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .toolbar-graphic.ai-working,
      .ai-kitt-strip::after { animation: none; }
      .ai-kitt-strip::after {
        left: 50%;
        transform: translateX(-50%);
      }
    }

    @media (max-width: 760px) {
      .bar { grid-template-columns: 1fr auto; }
      .tools { grid-column: 1 / -1; grid-row: 2; overflow: visible; flex-wrap: wrap; justify-content: flex-start; }
      .whiteboard-toolbar { grid-column: 1 / -1; grid-row: 3; }
      .workspace { padding: .6rem 2.8rem 4rem 0; }
      .paper { min-height: calc(100vh - 7rem); padding: 2rem 1.25rem; box-shadow: none; }
      .action.export { display: none; }
      .page-scrollbar { top: clamp(8.2rem, 23vh, 12rem); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202124;
        --paper: #292a2d;
        --ink: #f1f3f4;
        --muted: #aeb2b7;
        --line: #46484d;
        --button-hover: #3a3c40;
      }
      .block pre, th { background: #34363a; }
      .block blockquote { color: #c4c7cc; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="bar" data-ai-state="idle">
      <input id="title" aria-label="Shared notes title" value="Shared notes" autocomplete="off">
      <nav class="tools" aria-label="Document controls">
        <button class="tool toolbar-graphic" id="save-notes-file" type="button" title="Save notes file" aria-label="Save notes file" data-tone="green">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5V3Zm3 0v6h8V3M8 21v-8h8v8"/></svg>
        </button>
        <button class="tool toolbar-graphic" id="open-notes-file" type="button" title="Open notes file" aria-label="Open notes file" data-tone="amber">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3V6Zm0 5h18M6 3h5l2 2"/></svg>
        </button>
        <button class="tool toolbar-graphic" id="new-notes-file" type="button" title="New clean notes file" aria-label="New clean notes file" data-tone="blue">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6V3Zm8 0v5h5M9 14h6M12 11v6"/></svg>
        </button>
        <button class="tool toolbar-graphic" id="ai-assist" type="button" title="Ask AI about the last edit" aria-label="Ask AI about the last edit" data-tone="purple">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3Zm6 10 .8 2.2L21 16l-2.2.8L18 19l-.8-2.2L15 16l2.2-.8L18 13ZM6 14l1.1 3L10 18l-2.9 1L6 22l-1.1-3L2 18l2.9-1L6 14Z"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="tool toolbar-graphic" type="button" data-command="bold" title="Bold" aria-label="Bold">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 4h5a4 4 0 0 1 0 8H7m0 0h6a4 4 0 0 1 0 8H7"/></svg>
        </button>
        <button class="tool toolbar-graphic" type="button" data-command="italic" title="Italic" aria-label="Italic">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h7M7 20h7M14 4l-4 16"/></svg>
        </button>
        <button class="tool toolbar-graphic" type="button" data-command="underline" title="Underline" aria-label="Underline">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v7a5 5 0 0 0 10 0V4M5 20h14"/></svg>
        </button>
        <button class="tool toolbar-graphic" type="button" data-block="h1" title="Heading" aria-label="Heading">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14M13 5v14M4 12h9M18 10v9M16.5 11.5 18 10"/></svg>
        </button>
        <button class="tool toolbar-graphic" type="button" data-command="insertUnorderedList" title="List" aria-label="List">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="5" cy="17" r="1" fill="currentColor" stroke="none"/><path d="M9 7h10M9 12h10M9 17h10"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="tool toolbar-graphic insert-tool" id="add-text" type="button" title="Text" aria-label="Text" data-tone="blue">
          <svg class="toolbar-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M12 5v14M8 19h8"/></svg>
        </button>
        <button class="tool toolbar-graphic insert-tool" id="add-table" type="button" title="Table" aria-label="Table" data-tone="green">

  <script>
    'use strict';

    const ALLOWED_TAGS = new Set([
      'A', 'B', 'BLOCKQUOTE', 'BR', 'CAPTION', 'CODE', 'COL', 'COLGROUP', 'DIV',
      'EM', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'HR', 'I', 'IMG', 'LI', 'OL',
      'P', 'PRE', 'S', 'SPAN', 'STRIKE', 'STRONG', 'SUB', 'SUP', 'TABLE', 'TBODY',
      'TD', 'TFOOT', 'TH', 'THEAD', 'TR', 'U', 'UL'
    ]);
    const SAFE_STYLES = new Set([
      'background-color', 'color', 'font-size', 'font-style', 'font-weight',
      'letter-spacing', 'line-height', 'margin-left', 'text-align',
      'text-decoration', 'text-indent', 'vertical-align', 'white-space'
    ]);
    const IMAGE_PATTERN = /^data:image\/(png|jpeg|gif|webp);base64,/i;
    const WHITEBOARD_WIDTH = 1600;
    const WHITEBOARD_HEIGHT = 1000;
    const WHITEBOARD_HEIGHT_MIN = 600;
    const WHITEBOARD_HEIGHT_MAX = 8000;
    const WHITEBOARD_HEIGHT_STEP = 200;
    const WHITEBOARD_HEIGHT_DRAG_STEP = 50;
    const WHITEBOARD_MAX_POINTS_PER_STROKE = 5000;
    const WHITEBOARD_STREAM_INTERVAL_MS = 80;
    const WHITEBOARD_STREAM_QUEUE_MAX = 8;
    const WHITEBOARD_COMMIT_INTERVAL_MS = 250;
    const WHITEBOARD_COMMIT_BATCH_MAX = 20;
    const WHITEBOARD_RETRY_MAX_MS = 60 * 1000;
    const WHITEBOARD_AI_RECENT_STROKES = 64;
    const WHITEBOARD_AI_PADDING = 36;
    const WHITEBOARD_AI_FONT_SIZE = 48;
    const WHITEBOARD_TEXT_MIN_FONT_SIZE = 18;
    const WHITEBOARD_TEXT_RIGHT_MARGIN = 64;
    const WHITEBOARD_TEXT_MIN_LINE_WIDTH = 120;
    const WHITEBOARD_AI_VERTICAL_GAP = 96;
    const WHITEBOARD_AI_START_RESERVE = 200;
    const WHITEBOARD_AI_LINE_STREAM_MS = 180;
    const WHITEBOARD_AI_FONT_FAMILY = '"Segoe Script", "Apple Chancery", "URW Chancery L", "Lucida Calligraphy", cursive';
    const NOTES_FILE_MAX_BYTES = 20 * 1024 * 1024;
    const AUTOSAVE_INTERVAL_MS = 800;
    const POLL_FALLBACK_INTERVAL_MS = 5000;
    const SAVE_RETRY_BASE_MS = 1000;
    const SAVE_RETRY_MAX_MS = 30 * 1000;
    const pendingBridgeCalls = new Map();
    let bridgeRequestId = 1;
    let currentDocument = null;
    let selectedBlockId = null;
    let insertionAfterBlockId = null;
    let savedRange = null;
    let dirty = false;
    let saving = false;
    let saveTimer = null;
    let statusTimer = null;
    let formulaEditId = null;
    let formulaPreviewTimer = null;
    let editGeneration = 0;
    let savePromise = null;
    let saveFailureCount = 0;
    let titleDirty = false;
    let deferredRemoteDocument = null;
    let connectionWarningShown = false;
    let liveEventsConnected = false;
    let liveServerInstanceId = null;
    let whiteboardStreamSending = false;
    let lastEditedBlockId = null;
    let notesFileHandle = null;
    let aiBusy = false;
    let aiRequestContext = null;
    const dirtyBlockIds = new Set();
    const deletedBlockIds = new Set();
    const whiteboardStreamQueue = [];
    const whiteboardClientId = newClientId();

    const paper = document.getElementById('paper');
    const toolbarBar = document.querySelector('.bar');
    const titleInput = document.getElementById('title');
    const whiteboardToolbar = document.getElementById('whiteboard-toolbar');
    const statusEl = document.getElementById('status');
    const imageInput = document.getElementById('image-input');
    const notesFileInput = document.getElementById('notes-file-input');
    const aiButton = document.getElementById('ai-assist');
    const aiButtonHomeAnchor = aiButton.nextElementSibling;
    const formulaModal = document.getElementById('formula-modal');
    const formulaSource = document.getElementById('formula-source');
    const formulaPreview = document.getElementById('formula-preview');
    const pageScrollbar = document.getElementById('page-scrollbar');
    const pageScrollUp = document.getElementById('page-scroll-up');
    const pageScrollDown = document.getElementById('page-scroll-down');
    const pageScrollTrack = document.getElementById('page-scroll-track');
    const pageScrollThumb = document.getElementById('page-scroll-thumb');
    let pageScrollDrag = null;

    function pageScrollRoot() {
      return document.scrollingElement || document.documentElement;
    }

    function pageScrollMetrics() {
      const root = pageScrollRoot();
      const maximum = Math.max(0, root.scrollHeight - root.clientHeight);
      const trackHeight = Math.max(0, pageScrollTrack.clientHeight);
      const thumbHeight = maximum > 0
        ? Math.max(44, Math.min(trackHeight, trackHeight * root.clientHeight / root.scrollHeight))
        : trackHeight;
      return {
        root,
        maximum,
        trackHeight,
        thumbHeight,
        travel: Math.max(0, trackHeight - thumbHeight)
      };
    }

    function updatePageScrollbar() {
      const metrics = pageScrollMetrics();
      const position = metrics.maximum > 0
        ? Math.min(1, Math.max(0, metrics.root.scrollTop / metrics.maximum))
        : 0;
      pageScrollbar.dataset.scrollable = String(metrics.maximum > 0);
      pageScrollThumb.style.height = `${metrics.thumbHeight}px`;
      pageScrollThumb.style.transform = `translateY(${position * metrics.travel}px)`;
      pageScrollTrack.setAttribute('aria-valuemax', String(Math.round(metrics.maximum)));
      pageScrollTrack.setAttribute('aria-valuenow', String(Math.round(metrics.root.scrollTop)));
      pageScrollUp.disabled = metrics.root.scrollTop <= 0;
      pageScrollDown.disabled = metrics.root.scrollTop >= metrics.maximum - 1;
    }

    function movePageScrollTo(value) {
      const metrics = pageScrollMetrics();
      metrics.root.scrollTop = Math.min(metrics.maximum, Math.max(0, value));
      updatePageScrollbar();
    }

    function movePageScrollBy(direction) {
      const distance = Math.max(240, Math.round(window.innerHeight * .78));
      movePageScrollTo(pageScrollRoot().scrollTop + distance * direction);
    }

    pageScrollUp.addEventListener('click', () => movePageScrollBy(-1));
    pageScrollDown.addEventListener('click', () => movePageScrollBy(1));
    pageScrollTrack.addEventListener('click', (event) => {
      if (event.target === pageScrollThumb) return;
      const metrics = pageScrollMetrics();
      if (!metrics.maximum || !metrics.travel) return;
      const bounds = pageScrollTrack.getBoundingClientRect();
      const target = (event.clientY - bounds.top - metrics.thumbHeight / 2) / metrics.travel;
      movePageScrollTo(target * metrics.maximum);
    });
    pageScrollTrack.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowUp') movePageScrollBy(-.2);
      else if (event.key === 'ArrowDown') movePageScrollBy(.2);
      else if (event.key === 'PageUp') movePageScrollBy(-1);
      else if (event.key === 'PageDown') movePageScrollBy(1);
      else if (event.key === 'Home') movePageScrollTo(0);
      else if (event.key === 'End') movePageScrollTo(pageScrollMetrics().maximum);
      else return;
      event.preventDefault();
    });
    pageScrollThumb.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      event.stopPropagation();
      pageScrollDrag = {
        pointerId: event.pointerId,
        startY: event.clientY,
        startScrollTop: pageScrollRoot().scrollTop
      };
      try { pageScrollThumb.setPointerCapture(event.pointerId); } catch (_) { /* Window listeners are the fallback. */ }
    });
    window.addEventListener('pointermove', (event) => {
      if (!pageScrollDrag || event.pointerId !== pageScrollDrag.pointerId) return;
      event.preventDefault();
      const metrics = pageScrollMetrics();
      if (!metrics.travel) return;
      movePageScrollTo(pageScrollDrag.startScrollTop
        + (event.clientY - pageScrollDrag.startY) * metrics.maximum / metrics.travel);
    }, { passive: false });
    const finishPageScrollDrag = (event) => {
      if (!pageScrollDrag || event.pointerId !== pageScrollDrag.pointerId) return;
      pageScrollDrag = null;
      try {
        if (pageScrollThumb.hasPointerCapture?.(event.pointerId)) pageScrollThumb.releasePointerCapture(event.pointerId);
      } catch (_) { /* The host may already have released it. */ }
    };
    window.addEventListener('pointerup', finishPageScrollDrag);
    window.addEventListener('pointercancel', finishPageScrollDrag);
    window.addEventListener('scroll', updatePageScrollbar, { passive: true });
    window.addEventListener('resize', updatePageScrollbar, { passive: true });
    if (typeof ResizeObserver === 'function') new ResizeObserver(updatePageScrollbar).observe(paper);

    function newBlockId() {
      const bytes = new Uint8Array(10);
      crypto.getRandomValues(bytes);
      return `b_${Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('')}`;
    }

    function newStrokeId() {
      const bytes = new Uint8Array(10);
      crypto.getRandomValues(bytes);
      return `s_${Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('')}`;
    }

    function newAnnotationId() {
      const bytes = new Uint8Array(10);
      crypto.getRandomValues(bytes);
      return `a_${Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('')}`;
    }

    function newClientId() {
      const bytes = new Uint8Array(10);
      crypto.getRandomValues(bytes);
      return `c_${Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0')).join('')}`;
    }

    function cloneStrokes(strokes) {
      return Array.isArray(strokes) ? strokes.map((stroke) => ({
        ...stroke,
        points: stroke.points.map((point) => ({ ...point }))
      })) : [];
    }

    function cloneAnnotations(annotations) {
      return Array.isArray(annotations)
        ? annotations.map((annotation) => ({ ...annotation }))
        : [];
    }

    function showStatus(message, error = false, persistent = false) {
      clearTimeout(statusTimer);
      statusEl.textContent = message;
      statusEl.classList.toggle('error', error);
      statusEl.classList.add('show');
      if (!persistent) statusTimer = setTimeout(() => statusEl.classList.remove('show'), 1800);
    }

    function sanitizeStyle(style) {
      const safe = [];
      for (const property of Array.from(style)) {
        const name = property.toLowerCase();
        const value = style.getPropertyValue(property).trim();
        if (!SAFE_STYLES.has(name)) continue;
        if (/url\s*\(|expression\s*\(|javascript:|vbscript:/i.test(value)) continue;
        if (value.length <= 120) safe.push(`${name}: ${value}`);
      }
      return safe.join('; ');
    }

    function sanitizeRichHtml(html) {
      const parsed = new DOMParser().parseFromString(String(html || ''), 'text/html');
      const elements = Array.from(parsed.body.querySelectorAll('*'));
      for (const element of elements) {
        if (!ALLOWED_TAGS.has(element.tagName)) {
          element.replaceWith(...element.childNodes);
          continue;
        }
        const style = sanitizeStyle(element.style);
        const href = element.tagName === 'A' ? String(element.getAttribute('href') || '') : '';
        const source = element.tagName === 'IMG' ? String(element.getAttribute('src') || '') : '';
        const alt = element.tagName === 'IMG' ? String(element.getAttribute('alt') || '') : '';
        const colspan = ['TD', 'TH'].includes(element.tagName) ? element.getAttribute('colspan') : null;
        const rowspan = ['TD', 'TH'].includes(element.tagName) ? element.getAttribute('rowspan') : null;
        for (const attribute of Array.from(element.attributes)) element.removeAttribute(attribute.name);
        if (style) element.setAttribute('style', style);
        if (element.tagName === 'A' && /^(https?:|mailto:|#)/i.test(href)) {
          element.setAttribute('href', href);
          element.setAttribute('target', '_blank');
          element.setAttribute('rel', 'noopener noreferrer');
        }
        if (element.tagName === 'IMG') {
          if (IMAGE_PATTERN.test(source)) {
            element.setAttribute('src', source.replace(/\s+/g, ''));
            element.setAttribute('alt', alt.slice(0, 500));
          } else {
            const replacement = parsed.createElement('span');
            replacement.textContent = alt ? `[${alt}]` : '';
            element.replaceWith(replacement);
          }
        }
        if (colspan && /^\d{1,2}$/.test(colspan)) element.setAttribute('colspan', colspan);
        if (rowspan && /^\d{1,2}$/.test(rowspan)) element.setAttribute('rowspan', rowspan);
      }
      return parsed.body.innerHTML;
    }

    function bridgeRequest(method, params) {
      const id = bridgeRequestId++;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pendingBridgeCalls.delete(id);
          reject(new Error(`Bridge timeout: ${method}`));
        }, 15000);
        pendingBridgeCalls.set(id, {
          resolve: (value) => { clearTimeout(timer); resolve(value); },
          reject: (error) => { clearTimeout(timer); reject(error); }
        });
        window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
      });
    }

    async function callTool(name, args) {
      if (window.openai && typeof window.openai.callTool === 'function') {
        return window.openai.callTool(name, args);
      }
      if (window.parent !== window) {
        return bridgeRequest('tools/call', { name, arguments: args });
      }
      const response = await fetch('/api/document-tool', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name, arguments: args })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
      return result;
    }

    function publishWhiteboardStream(event) {
      if (window.parent !== window) return;
      if (whiteboardStreamQueue.length >= WHITEBOARD_STREAM_QUEUE_MAX) {
        whiteboardStreamQueue.shift();
      }
      whiteboardStreamQueue.push(event);
      if (whiteboardStreamSending) return;
      whiteboardStreamSending = true;
      void (async () => {
        try {
          while (whiteboardStreamQueue.length) {
            const next = whiteboardStreamQueue.shift();
            try {
              await fetch('/api/whiteboard-stream', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(next)
              });
            } catch (_) {
              // Preview traffic is best effort. The durable stroke commit is retried separately.
            }
          }
        } finally {
          whiteboardStreamSending = false;
          if (whiteboardStreamQueue.length) publishWhiteboardStream(whiteboardStreamQueue.shift());
        }
      })();
    }

    function unwrapToolResult(result) {
      if (!result) return {};
      if (result.result && (result.result.structuredContent || result.result.content)) return result.result;
      return result;
    }

    function resultDocument(result) {
      const value = unwrapToolResult(result);
      return value.structuredContent?.document || value.document || null;
    }

    function resultMath(result) {
      const value = unwrapToolResult(result);
      return value.structuredContent?.math || value.math || null;
    }

    function toolError(result) {
      const value = unwrapToolResult(result);
      if (value.isError) {
        const text = value.content?.find((item) => item.type === 'text')?.text || 'Tool error';
        try { return JSON.parse(text).error || text; } catch (_) { return text; }
      }
      return '';
    }

    function liveModelSnapshot() {
      const sourceBlocks = snapshotBlocks();
      const blocks = sourceBlocks.slice(0, 30).map((block) => {
        if (block.type === 'whiteboard') {
          return { id: block.id, type: block.type, content: 'handwriting' };
        }
        if (block.type === 'image') {
          return { id: block.id, type: block.type, alt: block.alt, width_percent: block.width_percent };
        }
        if (block.type === 'formula') {
          return { id: block.id, type: block.type, latex: block.latex, display: block.display };
        }
        return { id: block.id, type: block.type, html: String(block.html || '').slice(0, 1000) };
      });
      return {
        document_id: currentDocument.document_id,
        revision: currentDocument.revision,
        title: titleInput.value,
        selected_block_id: selectedBlockId,
        dirty,
        blocks,
        truncated: sourceBlocks.length > blocks.length
      };
    }

    function updateModelContext() {
      if (!currentDocument) return;
      const snapshot = liveModelSnapshot();
      const summary = `Shared live scratchpad. The UI snapshot can include unsynced keystrokes. Use mdos_document_read before applying edits.\nLIVE_SNAPSHOT ${JSON.stringify(snapshot)}`;
      if (window.openai && typeof window.openai.setWidgetState === 'function') {
        window.openai.setWidgetState({
          modelContent: summary,
          privateContent: {
            documentId: currentDocument.document_id,
            revision: currentDocument.revision,
            selectedBlockId
          },
          imageIds: []
        });
      }
      window.parent.postMessage({
        jsonrpc: '2.0',
        method: 'ui/update-model-context',
        params: { content: [{ type: 'text', text: summary }] }
      }, '*');
    }

    function selectBlock(element) {
      for (const block of paper.querySelectorAll('.block.selected')) block.classList.remove('selected');
      if (!element) {
        selectedBlockId = null;
        refreshWhiteboardToolbar();
        updateModelContext();
        return;
      }
      element.classList.add('selected');
      selectedBlockId = element.dataset.blockId;
      refreshWhiteboardToolbar(element);
      updateModelContext();
    }

    function refreshWhiteboardToolbar(preferredElement = null) {
      const preferred = preferredElement?.dataset.blockType === 'whiteboard'
        ? preferredElement
        : null;
      const whiteboard = preferred || paper.querySelector('[data-block-type="whiteboard"]');
      const rows = whiteboard?.whiteboardToolbarRows;
      if (!Array.isArray(rows) || !rows.length) {
        whiteboardToolbar.replaceChildren();
        if (aiButtonHomeAnchor?.parentElement) aiButtonHomeAnchor.before(aiButton);
        whiteboardToolbar.hidden = true;
        return;
      }
      if (rows.some((row) => row.parentElement !== whiteboardToolbar)) {
        whiteboardToolbar.replaceChildren(...rows);
      }
      const strip = whiteboardToolbar.querySelector('.ai-kitt-strip');
      if (strip) strip.before(aiButton);
      updateAiKittStrip(strip, toolbarBar.dataset.aiState);
      whiteboardToolbar.hidden = false;
    }

    function setInsertionPoint(element) {
      for (const block of paper.querySelectorAll('.block.insertion-anchor')) {
        block.classList.remove('insertion-anchor');
      }
      insertionAfterBlockId = element?.dataset.blockId || null;
      paper.classList.toggle('insertion-at-start', !element);
      if (element) element.classList.add('insertion-anchor');
    }

    function insertionAnchorAt(clientY) {
      let previous = null;
      for (const block of paper.children) {
        const bounds = block.getBoundingClientRect();
        if (clientY < bounds.top + bounds.height / 2) return previous;
        previous = block;
      }
      return previous;
    }

    function createRichElement(block) {
      const element = document.createElement('div');
      element.className = `block ${block.type}`;
      element.dataset.blockId = block.id;
      element.dataset.blockType = block.type;
      element.contentEditable = 'true';
      element.spellcheck = true;
      element.innerHTML = sanitizeRichHtml(block.html) || '<p><br></p>';
      return element;
    }

    function createFormulaElement(block) {
      const element = document.createElement('div');
      element.className = 'block formula';
      element.dataset.blockId = block.id;
      element.dataset.blockType = 'formula';
      element.dataset.latex = block.latex;
      element.dataset.display = String(block.display !== false);
      element.tabIndex = 0;
      element.setAttribute('aria-label', 'Formula. Double click to edit.');
      element.innerHTML = block.mathml || '';
      return element;
    }

    function createImageElement(block) {
      const figure = document.createElement('figure');
      figure.className = 'block image';
      figure.dataset.blockId = block.id;
      figure.dataset.blockType = 'image';
      figure.dataset.dataUri = block.data_uri;
      figure.dataset.widthPercent = String(block.width_percent || 100);
      const image = document.createElement('img');
      image.src = block.data_uri;
      image.alt = block.alt || '';
      image.style.width = `${block.width_percent || 100}%`;
      const caption = document.createElement('figcaption');
      caption.contentEditable = 'true';
      caption.textContent = block.alt || '';
      caption.setAttribute('aria-label', 'Image caption');
      figure.append(image, caption);
      return figure;
    }

    const WHITEBOARD_ICON_PATHS = Object.freeze({
      pen: 'M4 20l1.5-5.5L15 5l4 4-9.5 9.5L4 20Zm9-13 4 4M4 20l5.5-1.5',
      eraser: 'M4 15 14 5l6 6-8 8H8l-4-4Zm6-6 6 6M12 19h8',
      select: 'M4 4h6M4 4v6M20 4h-6M20 4v6M4 20h6M4 20v-6M20 20h-6M20 20v-6',
      move: 'M12 2l3 3h-2v5h5V8l3 3-3 3v-2h-5v5h2l-3 3-3-3h2v-5H6v2l-3-3 3-3v2h5V5H9l3-3Z',
      cut: 'M9 8 20 19M9 16 20 5M4 6a3 3 0 1 0 6 0 3 3 0 0 0-6 0Zm0 12a3 3 0 1 0 6 0 3 3 0 0 0-6 0Z',
      paste: 'M9 5h10v16H9zM5 3h10v2M5 3v14h4M8 3a2 2 0 0 1 4 0',
      undo: 'M9 7 4 12l5 5M5 12h8a7 7 0 0 1 7 7',
      clear: 'M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6',
      refresh: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7',
      contractVertical: 'M12 3v7M9 7l3 3 3-3M12 21v-7M9 17l3-3 3 3',
      expandVertical: 'M12 10V3M9 6l3-3 3 3M12 14v7M9 18l3 3 3-3',
      resetHeight: 'M5 4h14M5 20h14M12 7v10M9 10l3-3 3 3M9 14l3 3 3-3'
    });

    function createWhiteboardIcon(name) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.classList.add('whiteboard-icon');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('focusable', 'false');
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', WHITEBOARD_ICON_PATHS[name]);
      svg.appendChild(path);
      return svg;
    }

    function createWhiteboardColorDot(color) {
      const dot = document.createElement('span');
      dot.className = 'whiteboard-color-dot';
      dot.style.setProperty('--whiteboard-swatch', color);
      dot.setAttribute('aria-hidden', 'true');
      return dot;
    }

    function createWhiteboardControl(label, title, visual, action) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'whiteboard-control';
      button.setAttribute('aria-label', label);
      button.title = title;
      button.appendChild(visual);
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        action(button);
      });
      return button;
    }

    function updateAiKittStrip(strip, value) {
      if (!strip) return;
      const state = ['idle', 'working', 'done', 'failed'].includes(value) ? value : 'idle';
      const label = state === 'working'
        ? 'AI busy'
        : state === 'failed' ? 'AI failed' : 'AI available';
      strip.dataset.state = state;
      strip.setAttribute('aria-label', label);
      strip.title = label;
    }

    function createAiKittStrip() {
      const strip = document.createElement('span');
      strip.className = 'ai-kitt-strip';
      strip.setAttribute('role', 'status');
      strip.setAttribute('aria-live', 'polite');
      for (let index = 0; index < 5; index += 1) {
        const led = document.createElement('span');
        led.className = 'ai-kitt-led';
        led.setAttribute('aria-hidden', 'true');
        strip.appendChild(led);
      }
      updateAiKittStrip(strip, toolbarBar.dataset.aiState);
      return strip;
    }

    function createWhiteboardElement(block) {
      const element = document.createElement('section');
      element.className = 'block whiteboard';
      element.dataset.blockId = block.id;
      element.dataset.blockType = 'whiteboard';
      element.setAttribute('aria-label', 'Shared handwriting Whiteboard');

      const whiteboardControls = document.createElement('div');
      whiteboardControls.className = 'whiteboard-toolbar-row';
      whiteboardControls.setAttribute('role', 'group');
      whiteboardControls.setAttribute('aria-label', 'Whiteboard controls');
      const canvas = document.createElement('canvas');
      canvas.className = 'whiteboard-canvas';
      canvas.width = WHITEBOARD_WIDTH;
      const initialHeight = Math.min(
        WHITEBOARD_HEIGHT_MAX,
        Math.max(WHITEBOARD_HEIGHT_MIN, Number.parseInt(block.height_px, 10) || WHITEBOARD_HEIGHT)
      );
      canvas.height = initialHeight;
      element.dataset.heightPx = String(initialHeight);
      canvas.tabIndex = 0;
      canvas.setAttribute('aria-label', 'Write here with pen, touch, or mouse');
      const annotationLayer = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      annotationLayer.classList.add('whiteboard-annotation-layer');
      annotationLayer.setAttribute('width', String(WHITEBOARD_WIDTH));
      annotationLayer.setAttribute('height', String(initialHeight));
      annotationLayer.setAttribute('viewBox', `0 0 ${WHITEBOARD_WIDTH} ${initialHeight}`);
      annotationLayer.setAttribute('preserveAspectRatio', 'xMinYMin meet');
      annotationLayer.setAttribute('aria-label', 'Rendered Whiteboard answers');
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'whiteboard-resize-handle';
      resizeHandle.tabIndex = 0;
      resizeHandle.setAttribute('role', 'separator');
      resizeHandle.setAttribute('aria-label', 'Resize Whiteboard height');
      resizeHandle.setAttribute('aria-orientation', 'horizontal');
      resizeHandle.setAttribute('aria-valuemin', String(WHITEBOARD_HEIGHT_MIN));
      resizeHandle.setAttribute('aria-valuemax', String(WHITEBOARD_HEIGHT_MAX));
      resizeHandle.setAttribute('aria-valuenow', String(initialHeight));
      resizeHandle.title = 'Drag vertically to resize Whiteboard height';
      const context = canvas.getContext('2d', { alpha: false });
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, canvas.width, canvas.height);

      const initialStrokes = cloneStrokes(block.strokes);
      const initialAnnotations = cloneAnnotations(block.annotations);
      const state = {
        annotations: initialAnnotations,
        annotationReveal: null,
        clipboard: null,
        color: '#202124',
        committedAnnotations: cloneAnnotations(initialAnnotations),
        committedHeightPx: initialHeight,
        committedStrokes: cloneStrokes(initialStrokes),
        commitTimer: null,
        drawing: false,
        activeStroke: null,
        lastPointerPoint: null,
        moveOrigin: null,
        moving: false,
        pendingOperations: [],
        pointerId: null,
        pasteOffset: 0,
        previewTimer: null,
        ready: true,
        retryFailures: 0,
        retryTimer: null,
        recentStrokeAt: 0,
        recentStrokeIds: initialStrokes.slice(-WHITEBOARD_AI_RECENT_STROKES).map((stroke) => stroke.id),
        revealTimer: null,
        revealToken: 0,
        selectedAnnotationIds: [],
        selectedStrokeIds: [],
        selecting: false,
        selectionAnchor: null,
        selectionRect: null,
        strokeTool: 'pen',
        streamSentPointIndex: 0,
        streamSequence: 0,
        heightPx: initialHeight,
        strokes: initialStrokes,
        syncing: false,
        tool: 'pen'
      };
      element.whiteboardState = state;

      let penButton;
      let eraserButton;
      let selectButton;
      let moveButton;
      let cutButton;
      let pasteButton;
      let updateButton;
      let colorButtons = [];
      function setTool(tool) {
        if (!['select', 'move'].includes(tool)) clearWhiteboardSelection(false);
        state.tool = tool;
        canvas.dataset.tool = tool;
        penButton.classList.toggle('active', tool === 'pen');
        eraserButton.classList.toggle('active', tool === 'eraser');
        selectButton?.classList.toggle('active', tool === 'select');
        moveButton?.classList.toggle('active', tool === 'move');
        penButton.setAttribute('aria-pressed', String(tool === 'pen'));
        eraserButton.setAttribute('aria-pressed', String(tool === 'eraser'));
        selectButton?.setAttribute('aria-pressed', String(tool === 'select'));
        moveButton?.setAttribute('aria-pressed', String(tool === 'move'));
        for (const button of colorButtons) {
          const active = tool === 'pen' && button.dataset.color === state.color;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        }
        renderWhiteboard();
      }

      function strokeColor(stroke) {
        return stroke.tool === 'eraser' ? '#ffffff' : stroke.color;
      }

      function drawDot(stroke, point) {
        context.globalCompositeOperation = 'source-over';
        context.fillStyle = strokeColor(stroke);
        context.beginPath();
        context.arc(point.x, point.y, point.width / 2, 0, Math.PI * 2);
        context.fill();
      }

      function drawStroke(stroke) {
        if (!stroke.points.length) return;
        drawDot(stroke, stroke.points[0]);
        context.globalCompositeOperation = 'source-over';
        context.strokeStyle = strokeColor(stroke);
        context.lineCap = 'round';
        context.lineJoin = 'round';
        for (let index = 1; index < stroke.points.length; index += 1) {
          const previous = stroke.points[index - 1];
          const point = stroke.points[index];
          context.lineWidth = point.width;
          context.beginPath();
          context.moveTo(previous.x, previous.y);
          context.lineTo(point.x, point.y);
          context.stroke();
        }
      }

      function latexAnnotationRowCount(annotation) {
        const rows = String(annotation.mathml || '').match(/<mtr(?:\s|>)/g);
        return Math.max(1, rows?.length || 0);
      }

      function whiteboardAnnotationFontSize(annotation) {
        return Math.min(72, Math.max(
          WHITEBOARD_TEXT_MIN_FONT_SIZE,
          Number(annotation.font_size) || WHITEBOARD_AI_FONT_SIZE
        ));
      }

      function wrapWhiteboardLine(sourceLine, maxWidth) {
        const words = String(sourceLine).trim().split(/\s+/).filter(Boolean);
        if (!words.length) return [];
        const lines = [];
        let line = '';
        for (const word of words) {
          const candidate = line ? `${line} ${word}` : word;
          if (context.measureText(candidate).width <= maxWidth) {
            line = candidate;
            continue;
          }
          if (line) {
            lines.push(line);
            line = '';
          }
          if (context.measureText(word).width <= maxWidth) {
            line = word;
            continue;
          }
          let chunk = '';
          for (const character of Array.from(word)) {
            const nextChunk = `${chunk}${character}`;
            if (chunk && context.measureText(nextChunk).width > maxWidth) {
              lines.push(chunk);
              chunk = character;
            } else {
              chunk = nextChunk;
            }
          }
          line = chunk;
        }
        if (line) lines.push(line);
        return lines;
      }

      function annotationLayout(annotation) {
        if (annotation.data_uri) {
          return {
            fontSize: 0,
            font: '',
            lines: [],
            x: Number(annotation.x) || 0,
            y: Number(annotation.y) || 0,
            width: Math.max(16, Number(annotation.width) || 640),
            height: Math.max(16, Number(annotation.height) || 480)
          };
        }
        const fontSize = whiteboardAnnotationFontSize(annotation);
        const isLatex = Boolean(annotation.latex && annotation.mathml);
        const font = isLatex
          ? `600 ${fontSize}px "STIX Two Math", "Cambria Math", serif`
          : `700 ${fontSize}px ${WHITEBOARD_AI_FONT_FAMILY}`;
        const requestedX = Math.max(0, Number(annotation.x) || 0);
        const x = Math.min(
          requestedX,
          Math.max(0, canvas.width - WHITEBOARD_TEXT_RIGHT_MARGIN - WHITEBOARD_TEXT_MIN_LINE_WIDTH)
        );
        const maxWidth = Math.max(1, canvas.width - x - WHITEBOARD_TEXT_RIGHT_MARGIN);
        const text = String(annotation.text || '').trim();
        if (!text) return null;
        const lines = [];
        context.save();
        context.font = font;
        if (isLatex) {
          const width = Math.max(1, Math.min(maxWidth, context.measureText(text).width));
          const rowCount = latexAnnotationRowCount(annotation);
          context.restore();
          return {
            fontSize,
            font,
            lines: [text],
            rowCount,
            x,
            y: Number(annotation.y) || 0,
            width,
            height: fontSize * (rowCount * 1.9 + 0.6)
          };
        }
        const sourceLines = text.replace(/\r\n?/g, '\n').split('\n');
        for (const sourceLine of sourceLines) {
          const wrappedLines = wrapWhiteboardLine(sourceLine, maxWidth);
          if (!wrappedLines.length) {
            if (lines.length) lines.push('');
            continue;
          }
          lines.push(...wrappedLines);
        }
        const width = Math.min(
          maxWidth,
          Math.max(...lines.map((value) => context.measureText(value).width), 1)
        );
        context.restore();
        return {
          fontSize,
          font,
          lines,
          x,
          y: Number(annotation.y) || 0,
          width,
          height: fontSize + Math.max(0, lines.length - 1) * fontSize * 1.25
        };
      }

      element.whiteboardAnnotationLayout = annotationLayout;

      function whiteboardOccupiedBottom() {
        let bottom = 0;
        for (const stroke of state.strokes) {
          if (stroke.tool === 'eraser') continue;
          for (const point of stroke.points || []) {
            const width = Math.max(1, Number(point.width) || 1);
            bottom = Math.max(bottom, (Number(point.y) || 0) + width / 2);
          }
        }
        for (const annotation of state.annotations) {
          const layout = annotationLayout(annotation);
          if (layout) bottom = Math.max(bottom, layout.y + layout.height);
        }
        return bottom;
      }

      element.whiteboardOccupiedBottom = whiteboardOccupiedBottom;

      function whiteboardResponseY(questionStrokeIds, questionBounds, reserveHeight) {
        const ignored = new Set(questionStrokeIds || []);
        const occupiedRows = [];
        for (const stroke of state.strokes) {
          if (ignored.has(stroke.id) || stroke.tool === 'eraser' || !stroke.points?.length) continue;
          let top = canvas.height;
          let bottom = 0;
          for (const point of stroke.points) {
            const radius = Math.max(1, Number(point.width) || 1) / 2;
            top = Math.min(top, point.y - radius);
            bottom = Math.max(bottom, point.y + radius);
          }
          occupiedRows.push({ top, bottom });
        }
        for (const annotation of state.annotations) {
          const layout = annotationLayout(annotation);
          if (layout) occupiedRows.push({ top: layout.y, bottom: layout.y + layout.height });
        }
        occupiedRows.sort((first, second) => first.top - second.top);
        let candidate = Math.max(20, Math.ceil(
          Number(questionBounds?.maxY || 0) + WHITEBOARD_AI_VERTICAL_GAP
        ));
        const reserve = Math.max(1, Number(reserveHeight) || WHITEBOARD_AI_START_RESERVE);
        for (const row of occupiedRows) {
          if (row.bottom < candidate) continue;
          if (row.top > candidate + reserve) break;
          candidate = Math.ceil(row.bottom + WHITEBOARD_AI_VERTICAL_GAP);
        }
        return candidate;
      }

      element.whiteboardResponseY = whiteboardResponseY;

      function drawAnnotation(annotation, visibleLines = null) {
        const layout = annotationLayout(annotation);
        if (!layout) return;
        context.save();
        context.globalCompositeOperation = 'source-over';
        context.fillStyle = annotation.color || '#1769e0';
        context.font = layout.font;
        context.textBaseline = 'top';
        context.lineJoin = 'round';
        context.strokeStyle = 'rgba(255, 255, 255, 0.96)';
        context.lineWidth = Math.max(3, layout.fontSize * 0.11);
        const lines = Number.isInteger(visibleLines)
          ? layout.lines.slice(0, Math.max(0, visibleLines))
          : layout.lines;
        lines.forEach((value, index) => {
          const y = layout.y + index * layout.fontSize * 1.25;
          context.strokeText(value, layout.x, y);
          context.fillText(value, layout.x, y);
        });
        context.restore();
      }

      function renderLatexAnnotation(annotation, visibleLines = null) {
        const layout = annotationLayout(annotation);
        if (!layout) return;
        const { fontSize, x, y } = layout;
        const rowCount = latexAnnotationRowCount(annotation);
        const estimatedHeight = Math.max(160, Math.ceil(fontSize * (rowCount * 1.9 + 0.6)));
        const foreignObject = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
        foreignObject.dataset.annotationId = annotation.id;
        foreignObject.dataset.rowCount = String(rowCount);
        foreignObject.setAttribute('x', String(x));
        foreignObject.setAttribute('y', String(y));
        foreignObject.setAttribute('width', String(Math.max(1, canvas.width - x - WHITEBOARD_TEXT_RIGHT_MARGIN)));
        foreignObject.setAttribute('height', String(estimatedHeight));
        const host = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
        host.classList.add('whiteboard-latex');
        host.style.color = annotation.color || '#1769e0';
        host.style.fontSize = `${fontSize}px`;
        host.setAttribute('aria-label', annotation.text || annotation.latex);
        host.innerHTML = annotation.mathml;
        const rows = Array.from(host.querySelectorAll('mtr'));
        if (Number.isInteger(visibleLines)) {
          if (rows.length) {
            rows.forEach((row, index) => {
              row.style.visibility = index < visibleLines ? 'visible' : 'hidden';
            });
          } else if (visibleLines < 1) {
            host.style.visibility = 'hidden';
          }
        }
        foreignObject.appendChild(host);
        annotationLayer.appendChild(foreignObject);
        const measuredHeight = Math.ceil(host.scrollHeight + fontSize * 0.5);
        if (measuredHeight > estimatedHeight) {
          foreignObject.setAttribute('height', String(measuredHeight));
        }
      }

      function renderImageAnnotation(annotation) {
        const layout = annotationLayout(annotation);
        if (!layout) return;
        const image = document.createElementNS('http://www.w3.org/2000/svg', 'image');
        image.dataset.annotationId = annotation.id;
        image.setAttribute('x', String(layout.x));
        image.setAttribute('y', String(layout.y));
        image.setAttribute('width', String(layout.width));
        image.setAttribute('height', String(layout.height));
        image.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        image.setAttribute('href', annotation.data_uri);
        image.setAttributeNS('http://www.w3.org/1999/xlink', 'href', annotation.data_uri);
        annotationLayer.appendChild(image);
      }

      function segmentIntersectsRect(start, end, rect) {
        const deltaX = end.x - start.x;
        const deltaY = end.y - start.y;
        let minimum = 0;
        let maximum = 1;
        const edges = [
          [-deltaX, start.x - rect.left],
          [deltaX, rect.right - start.x],
          [-deltaY, start.y - rect.top],
          [deltaY, rect.bottom - start.y]
        ];
        for (const [direction, distance] of edges) {
          if (direction === 0) {
            if (distance < 0) return false;
            continue;
          }
          const ratio = distance / direction;
          if (direction < 0) {
            if (ratio > maximum) return false;
            minimum = Math.max(minimum, ratio);
          } else {
            if (ratio < minimum) return false;
            maximum = Math.min(maximum, ratio);
          }
        }
        return true;
      }

      function eraserHitsAnnotation(stroke, annotation) {
        if (stroke?.tool !== 'eraser' || !stroke.points?.length) return false;
        const layout = annotationLayout(annotation);
        if (!layout) return false;
        for (let index = 0; index < stroke.points.length; index += 1) {
          const start = stroke.points[Math.max(0, index - 1)];
          const end = stroke.points[index];
          const padding = Math.max(4, Number(start.width || 0) / 2, Number(end.width || 0) / 2);
          if (segmentIntersectsRect(start, end, {
            left: layout.x - padding,
            top: layout.y - padding,
            right: layout.x + layout.width + padding,
            bottom: layout.y + layout.height + padding
          })) return true;
        }
        return false;
      }

      function normalizedSelectionRect(start, end) {
        const left = Math.max(0, Math.min(start.x, end.x));
        const top = Math.max(0, Math.min(start.y, end.y));
        const right = Math.min(canvas.width, Math.max(start.x, end.x));
        const bottom = Math.min(canvas.height, Math.max(start.y, end.y));
        return { left, top, right, bottom, width: right - left, height: bottom - top };
      }

      function rectanglesIntersect(first, second) {
        return first.left <= second.right && first.right >= second.left
          && first.top <= second.bottom && first.bottom >= second.top;
      }

      function strokeIntersectsSelection(stroke, rect) {
        const points = stroke?.points || [];
        for (let index = 0; index < points.length; index += 1) {
          const point = points[index];
          const radius = Math.max(1, Number(point.width) || 1) / 2;
          if (rectanglesIntersect(rect, {
            left: point.x - radius,
            top: point.y - radius,
            right: point.x + radius,
            bottom: point.y + radius
          })) return true;
          if (index > 0) {
            const previous = points[index - 1];
            const padding = Math.max(radius, Math.max(1, Number(previous.width) || 1) / 2);
            if (segmentIntersectsRect(previous, point, {
              left: rect.left - padding,
              top: rect.top - padding,
              right: rect.right + padding,
              bottom: rect.bottom + padding
            })) return true;
          }
        }
        return false;
      }

      function annotationIntersectsSelection(annotation, rect) {
        const layout = annotationLayout(annotation);
        return Boolean(layout && rectanglesIntersect(rect, {
          left: layout.x,
          top: layout.y,
          right: layout.x + layout.width,
          bottom: layout.y + layout.height
        }));
      }

      function selectionCount() {
        return state.selectedStrokeIds.length + state.selectedAnnotationIds.length;
      }

      function refreshSelectionButtons() {
        const selected = selectionCount();
        if (moveButton) {
          moveButton.disabled = selected === 0;
          moveButton.title = selected ? `Move ${selected} selected Whiteboard items` : 'Select ink or AI text first';
        }
        if (cutButton) {
          cutButton.disabled = selected === 0;
          cutButton.title = selected ? `Cut ${selected} selected Whiteboard items` : 'Select ink or AI text first';
        }
        if (pasteButton) {
          const stored = (state.clipboard?.strokes?.length || 0) + (state.clipboard?.annotations?.length || 0);
          pasteButton.disabled = stored === 0;
          pasteButton.title = stored ? `Paste ${stored} Whiteboard items` : 'Nothing to paste';
        }
      }

      function clearWhiteboardSelection(render = true) {
        state.selecting = false;
        state.selectionAnchor = null;
        state.selectionRect = null;
        state.selectedStrokeIds = [];
        state.selectedAnnotationIds = [];
        refreshSelectionButtons();
        if (render) renderWhiteboard();
      }

      function updateWhiteboardSelection(rect) {
        state.selectionRect = rect;
        state.selectedStrokeIds = state.strokes
          .filter((stroke) => strokeIntersectsSelection(stroke, rect))
          .map((stroke) => stroke.id);
        state.selectedAnnotationIds = state.annotations
          .filter((annotation) => annotationIntersectsSelection(annotation, rect))
          .map((annotation) => annotation.id);
        refreshSelectionButtons();
      }

      function renderWhiteboardSelection() {
        const rect = state.selectionRect;
        if (!rect || !['select', 'move'].includes(state.tool)) return;
        const outline = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        outline.classList.add('whiteboard-selection');
        outline.dataset.selectedCount = String(selectionCount());
        outline.setAttribute('x', String(rect.left));
        outline.setAttribute('y', String(rect.top));
        outline.setAttribute('width', String(Math.max(1, rect.width)));
        outline.setAttribute('height', String(Math.max(1, rect.height)));
        annotationLayer.appendChild(outline);
      }

      function cutWhiteboardSelection() {
        const strokeIds = new Set(state.selectedStrokeIds);
        const annotationIds = new Set(state.selectedAnnotationIds);
        if (!strokeIds.size && !annotationIds.size) return;
        state.clipboard = {
          rect: { ...state.selectionRect },
          strokes: cloneStrokes(state.strokes.filter((stroke) => strokeIds.has(stroke.id))),
          annotations: cloneAnnotations(state.annotations.filter((annotation) => annotationIds.has(annotation.id)))
        };
        state.pasteOffset = 0;
        state.strokes = state.strokes.filter((stroke) => !strokeIds.has(stroke.id));
        state.annotations = state.annotations.filter((annotation) => !annotationIds.has(annotation.id));
        state.recentStrokeIds = state.recentStrokeIds.filter((strokeId) => !strokeIds.has(strokeId));
        if (annotationIds.has(state.annotationReveal?.id)) {
          clearTimeout(state.revealTimer);
          state.annotationReveal = null;
        }
        const cutCount = strokeIds.size + annotationIds.size;
        clearWhiteboardSelection(false);
        renderWhiteboard();
        for (const strokeId of strokeIds) {
          queueWhiteboardOperation({
            type: 'whiteboard_undo',
            block_id: element.dataset.blockId,
            stroke_id: strokeId
          });
        }
        for (const annotationId of annotationIds) {
          queueWhiteboardOperation({
            type: 'whiteboard_remove_text',
            block_id: element.dataset.blockId,
            annotation_id: annotationId
          });
        }
        lastEditedBlockId = element.dataset.blockId;
        showStatus(`Whiteboard · cut ${cutCount} item${cutCount === 1 ? '' : 's'}`);
      }

      function pasteWhiteboardSelection() {
        const clipboard = state.clipboard;
        const stored = (clipboard?.strokes?.length || 0) + (clipboard?.annotations?.length || 0);
        if (!stored || !clipboard.rect) return;
        const offset = 48 * (state.pasteOffset + 1);
        const deltaX = Math.max(0, Math.min(offset, canvas.width - clipboard.rect.right - 12));
        const desiredBottom = clipboard.rect.bottom + offset + 12;
        element.ensureWhiteboardHeight?.(desiredBottom);
        const deltaY = Math.max(0, Math.min(offset, state.heightPx - clipboard.rect.bottom - 12));
        const strokes = clipboard.strokes.map((stroke) => ({
          ...stroke,
          id: newStrokeId(),
          points: stroke.points.map((point) => ({
            ...point,
            x: point.x + deltaX,
            y: point.y + deltaY
          }))
        }));
        const annotations = clipboard.annotations.map((annotation) => ({
          ...annotation,
          id: newAnnotationId(),
          x: Number(annotation.x || 0) + deltaX,
          y: Number(annotation.y || 0) + deltaY
        }));
        state.strokes.push(...strokes);
        state.annotations.push(...annotations);
        state.pasteOffset += 1;
        state.selectionRect = {
          left: clipboard.rect.left + deltaX,
          top: clipboard.rect.top + deltaY,
          right: clipboard.rect.right + deltaX,
          bottom: clipboard.rect.bottom + deltaY,
          width: clipboard.rect.width,
          height: clipboard.rect.height
        };
        state.selectedStrokeIds = strokes.map((stroke) => stroke.id);
        state.selectedAnnotationIds = annotations.map((annotation) => annotation.id);
        const recentIds = strokes.filter((stroke) => stroke.tool !== 'eraser').map((stroke) => stroke.id);
        state.recentStrokeIds = [...state.recentStrokeIds, ...recentIds]
          .slice(-WHITEBOARD_AI_RECENT_STROKES);
        state.recentStrokeAt = Date.now();
        setTool('select');
        refreshSelectionButtons();
        renderWhiteboard();
        for (const stroke of strokes) {
          queueWhiteboardOperation({
            type: 'whiteboard_append_stroke',
            block_id: element.dataset.blockId,
            stroke
          });
        }
        for (const annotation of annotations) {
          queueWhiteboardOperation({
            type: 'whiteboard_add_text',
            block_id: element.dataset.blockId,
            annotation
          });
        }
        lastEditedBlockId = element.dataset.blockId;
        showStatus(`Whiteboard · pasted ${stored} item${stored === 1 ? '' : 's'}`);
      }

      function pointInsideSelection(point) {
        const rect = state.selectionRect;
        return Boolean(rect && point.x >= rect.left && point.x <= rect.right
          && point.y >= rect.top && point.y <= rect.bottom);
      }

      function beginWhiteboardMove(point) {
        if (!pointInsideSelection(point) || !selectionCount()) return false;
        const strokeIds = new Set(state.selectedStrokeIds);
        const annotationIds = new Set(state.selectedAnnotationIds);
        state.moveOrigin = {
          point: { ...point },
          rect: { ...state.selectionRect },
          strokes: cloneStrokes(state.strokes.filter((stroke) => strokeIds.has(stroke.id))),
          annotations: cloneAnnotations(state.annotations.filter((annotation) => annotationIds.has(annotation.id)))
        };
        state.moving = true;
        return true;
      }

      function moveWhiteboardSelection(point) {
        const origin = state.moveOrigin;
        if (!origin) return;
        const deltaX = Math.max(
          -origin.rect.left,
          Math.min(point.x - origin.point.x, canvas.width - origin.rect.right)
        );
        const deltaY = Math.max(
          -origin.rect.top,
          Math.min(point.y - origin.point.y, state.heightPx - origin.rect.bottom)
        );
        const strokes = new Map(origin.strokes.map((stroke) => [stroke.id, {
          ...stroke,
          points: stroke.points.map((strokePoint) => ({
            ...strokePoint,
            x: strokePoint.x + deltaX,
            y: strokePoint.y + deltaY
          }))
        }]));
        const annotations = new Map(origin.annotations.map((annotation) => [annotation.id, {
          ...annotation,
          x: Number(annotation.x || 0) + deltaX,
          y: Number(annotation.y || 0) + deltaY
        }]));
        state.strokes = state.strokes.map((stroke) => strokes.get(stroke.id) || stroke);
        state.annotations = state.annotations.map((annotation) => annotations.get(annotation.id) || annotation);
        state.selectionRect = {
          left: origin.rect.left + deltaX,
          top: origin.rect.top + deltaY,
          right: origin.rect.right + deltaX,
          bottom: origin.rect.bottom + deltaY,
          width: origin.rect.width,
          height: origin.rect.height
        };
        renderWhiteboard();
      }

      function finishWhiteboardMove() {
        const origin = state.moveOrigin;
        if (!origin) return;
        const strokeIds = new Set(state.selectedStrokeIds);
        const annotationIds = new Set(state.selectedAnnotationIds);
        const movedStrokes = cloneStrokes(state.strokes.filter((stroke) => strokeIds.has(stroke.id)));
        const movedAnnotations = cloneAnnotations(
          state.annotations.filter((annotation) => annotationIds.has(annotation.id))
        );
        const changed = state.selectionRect.left !== origin.rect.left
          || state.selectionRect.top !== origin.rect.top;
        state.moveOrigin = null;
        state.moving = false;
        if (!changed) return;
        for (const stroke of movedStrokes) {
          queueWhiteboardOperation({
            type: 'whiteboard_undo',
            block_id: element.dataset.blockId,
            stroke_id: stroke.id
          });
          queueWhiteboardOperation({
            type: 'whiteboard_append_stroke',
            block_id: element.dataset.blockId,
            stroke
          });
        }
        for (const annotation of movedAnnotations) {
          queueWhiteboardOperation({
            type: 'whiteboard_remove_text',
            block_id: element.dataset.blockId,
            annotation_id: annotation.id
          });
          queueWhiteboardOperation({
            type: 'whiteboard_add_text',
            block_id: element.dataset.blockId,
            annotation
          });
        }
        lastEditedBlockId = element.dataset.blockId;
        showStatus(`Whiteboard · moved ${selectionCount()} item${selectionCount() === 1 ? '' : 's'}`);
      }

      function renderWhiteboard() {
        context.globalCompositeOperation = 'source-over';
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        annotationLayer.replaceChildren();
        for (const stroke of state.strokes) drawStroke(stroke);
        for (const annotation of state.annotations) {
          const visibleLines = state.annotationReveal?.id === annotation.id
            ? state.annotationReveal.visibleLines
            : null;
          if (annotation.data_uri) renderImageAnnotation(annotation);
          else if (annotation.latex && annotation.mathml) renderLatexAnnotation(annotation, visibleLines);
          else drawAnnotation(annotation, visibleLines);
        }
        renderWhiteboardSelection();
      }

      element.streamWhiteboardAnnotation = (annotationId, onProgress = () => {}) => {
        const annotation = state.annotations.find((candidate) => candidate.id === annotationId);
        if (!annotation) return Promise.resolve(false);
        clearTimeout(state.revealTimer);
        const token = ++state.revealToken;
        const layout = annotationLayout(annotation);
        const totalLines = annotation.latex && annotation.mathml
          ? latexAnnotationRowCount(annotation)
          : Math.max(1, layout?.lines.length || 1);
        const requiredHeight = Math.ceil((Number(annotation.y) || 0) + (layout?.height || 0) + 48);
        if (requiredHeight > state.heightPx) {
          const expandedHeight = normalizedWhiteboardHeight(requiredHeight);
          if (applyWhiteboardHeight(expandedHeight)) queueWhiteboardHeight(expandedHeight);
        }
        state.annotationReveal = { id: annotationId, visibleLines: 1, totalLines };
        renderWhiteboard();
        onProgress({ visibleLines: 1, totalLines, done: totalLines === 1 });
        if (totalLines === 1) {
          state.annotationReveal = null;
          return Promise.resolve(true);
        }
        return new Promise((resolve) => {
          const advance = () => {
            const reveal = state.annotationReveal;
            const stillPresent = state.annotations.some((candidate) => candidate.id === annotationId);
            if (token !== state.revealToken || !reveal || !stillPresent) {
              resolve(false);
              return;
            }
            reveal.visibleLines += 1;
            const done = reveal.visibleLines >= reveal.totalLines;
            renderWhiteboard();
            onProgress({
              visibleLines: reveal.visibleLines,
              totalLines: reveal.totalLines,
              done
            });
            if (done) {
              state.annotationReveal = null;
              state.revealTimer = null;
              resolve(true);
              return;
            }
            state.revealTimer = setTimeout(advance, WHITEBOARD_AI_LINE_STREAM_MS);
          };
          state.revealTimer = setTimeout(advance, WHITEBOARD_AI_LINE_STREAM_MS);
        });
      };

      element.applyWhiteboardStream = (streamEvent) => {
        if (!streamEvent || streamEvent.client_id === whiteboardClientId) return;
        if (streamEvent.block_id !== element.dataset.blockId) return;
        const stroke = streamEvent.stroke;
        if (!stroke || !Array.isArray(stroke.points) || !stroke.points.length) return;
        drawStroke(stroke);
      };

      function loadWhiteboardImageSize(dataUri) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve({ width: image.naturalWidth, height: image.naturalHeight });
          image.onerror = () => reject(new Error('Clipboard image could not be decoded'));
          image.src = dataUri;
        });
      }

      element.pasteWhiteboardImage = async (file) => {
        if (!file || !/^image\/(png|jpeg|gif|webp)$/i.test(file.type)) return false;
        if (file.size > 5 * 1024 * 1024) throw new Error('Clipboard image is too large');
        const dataUri = await fileAsDataUri(file);
        const natural = await loadWhiteboardImageSize(dataUri);
